<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line Tools · bản thử riêng</title><link rel="stylesheet" href="css/style.css"><style>body{display:flex;flex-direction:column;padding:12px;gap:10px}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#lab-chart{position:relative;flex:1;min-height:350px}#lab-status,#lab-report{font-size:12px;white-space:pre-wrap}textarea{width:100%;height:90px}a{color:#9ab9ff}button{padding:6px 10px}</style></head><body>
